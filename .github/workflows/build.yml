name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Pushes already build every branch of this repo, so only build pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # paper-api ships Java 25 class files, so anything older cannot read them.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Name the artifact after the built jar
        id: jar
        run: |
          jar="$(ls target/PlayerKits2-*.jar | head -n 1)"
          echo "name=$(basename "$jar" .jar)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jar.outputs.name }}
          # The shade plugin leaves the unshaded jar behind as original-*.jar.
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error
