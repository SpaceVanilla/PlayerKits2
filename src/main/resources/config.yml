drop_items_if_full_inventory: false
claim_kit_short_command: false
close_inventory_on_claim: false
kit_preview: true
kit_preview_requires_kit_permission: false
# Players can choose the position of every item of a kit.
kit_arrangement: true
# Kits are claimed on the order the player arranged them.
kit_arrangement_claim_order: true
# Items can be moved directly on the preview inventory, without opening the arrange one.
# The items of the preview menu (buttons) can never be moved.
kit_arrangement_in_preview: true
# Changes made on the preview inventory are saved when it is closed, so the
# save item is not needed. Set it to false to only save when that item is clicked.
kit_arrangement_auto_save: true
# Kits that need a permission to be claimed can only be arranged by players that have it.
kit_arrangement_requires_kit_permission: true
# Extra permission needed to arrange kits, 'none' if any player can arrange them.
kit_arrangement_permission: none
# Slots that players can't move when they arrange a kit, so the items placed on them
# by the preview_slot option of the kit always stay there (the armor of the kit, for
# example). Slots without an item of the kit on them are arranged like any other one.
# Use single slots (36;37), ranges (36-40) or leave it empty to disable.
kit_arrangement_locked_slots: "36-40"
first_join_kit: none
new_kit_default_save_mode_original: true
new_kit_default_inventory: "main_inventory"
new_kit_default_values:
  cooldown: 3600
  permission_required: false
  actions:
    claim:
      1:
        action: "playsound: BLOCK_NOTE_BLOCK_PLING;10;2"
    error:
      1:
        action: "playsound: BLOCK_NOTE_BLOCK_PLING;10;0.1"
  display:
    default:
      id: STONE_SWORD
      name: "&c&l%kit_name% &cKit"
      lore:
        - '&fThis is a description of the kit.'
        - ''
        - '&7Edit it on the &c%kit_name%.yml &7file'
        - '&7or using &c/kit edit %kit_name%'
      item_flags:
        - HIDE_ATTRIBUTES
    no_permission:
      id: BARRIER
      name: "&c&l%kit_name% &cKit"
      lore:
        - "&cYou don't have permissions to claim"
        - "&cthis kit."
    cooldown:
      id: STONE_SWORD
      name: "&c&l%kit_name% &cKit"
      lore:
        - "&cYou need to wait &7%time%"
        - "&cto claim this kit again."
      item_flags:
        - HIDE_ATTRIBUTES
player_data_save_time: 300
update_notify: true
use_minimessage: false
mysql_database:
  enabled: false
  host: localhost
  port: 3306
  username: root
  password: root
  database: database
  pool:
    connectionTimeout: 5000
  advanced:
    verifyServerCertificate: false
    useSSL: true
    allowPublicKeyRetrieval: true